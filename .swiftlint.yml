excluded:
  - Tuner.xcodeproj
  - docs

disabled_rules:
  - trailing_whitespace
  - multiple_closures_with_trailing_closure  # SwiftUI .overlay{} triggers this spuriously

opt_in_rules:
  - empty_count
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

identifier_name:
  min_length: 1      # allow i, n etc. in DSP/math code
  excluded:
    - id

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 200
  error: 300

file_length:
  warning: 400
  error: 600
