name: Tuner
options:
  bundleIdPrefix: com.tunerapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Tuner:
    type: application
    platform: iOS
    sources:
      - path: Tuner
    info:
      path: Tuner/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Tuner needs access to your microphone to detect pitch."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunerapp.tuner
        TARGETED_DEVICE_FAMILY: "1"
  TunerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TunerTests
    dependencies:
      - target: Tuner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tunerapp.TunerTests
  TunerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TunerUITests
    dependencies:
      - target: Tuner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tunerapp.TunerUITests
schemes:
  Tuner:
    build:
      targets:
        Tuner: all
    test:
      targets:
        - TunerTests
        - TunerUITests
    run:
      config: Debug
